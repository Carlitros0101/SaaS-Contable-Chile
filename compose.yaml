name: saas-contable-chile-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_contable_chile
      POSTGRES_USER: contable_dev
      POSTGRES_PASSWORD: contable_dev_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saas-contable-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contable_dev -d saas_contable_chile"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28.2
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  saas-contable-postgres:
